name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.201

      - name: Restore
        run: dotnet restore iTunesPod.sln

      - name: Build
        run: dotnet build iTunesPod.sln -c Release --no-restore

      - name: Test
        run: dotnet test iTunesPod.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
